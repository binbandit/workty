[package]
name = "git-workty"
version = "0.3.3"
edition = "2024"
description = "Git worktrees as daily-driver workspaces"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/binbandit/workty"
homepage = "https://github.com/binbandit/workty"
keywords = ["git", "worktree", "workspace", "cli", "productivity"]
categories = ["command-line-utilities", "development-tools"]
authors = ["binbandit <crazywolf132@gmail.com>"]
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[[bin]]
name = "git-workty"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
owo-colors = "4"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dirs = "6.0"
sha2 = "0.10"
clap_mangen = "0.3"
rayon = "1.10"
console = "0.16"
# Only used for local repository inspection; all network operations shell out
# to the git CLI, so the ssh/https backends (and their OpenSSL build) are unneeded.
git2 = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
